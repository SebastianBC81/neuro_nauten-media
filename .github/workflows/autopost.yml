name: Instagram-Autoposter
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fällige Beiträge posten
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PAGES_BASE: https://sebastianbc81.github.io/neuro_nauten-media/
        run: python3 autopost/post.py
      - name: Status speichern
        if: always()
        run: |
          git config user.name "neuro_nauten-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add autopost
          git diff --cached --quiet && exit 0
          git commit -m "Autopost-Status aktualisiert"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
